# One command, locally or on an India-region VM (NIC MeghRaj / BHASHINI infra): docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hindi_charades
      POSTGRES_USER: hc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U hc"], interval: 5s, retries: 10 }
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://hc:${POSTGRES_PASSWORD}@db:5432/hindi_charades
      NODE_ENV: production
      COOKIE_SECURE: "1"
    volumes: [apidata:/app/.data]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: deploy/web.Dockerfile }
    depends_on: [api]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: { SITE_ADDRESS: "${SITE_ADDRESS:-localhost}" }
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on: [web]
    restart: unless-stopped
volumes: { dbdata: {}, apidata: {}, caddydata: {} }
